<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buchanan Lake Territory Cards</title>
<style>
:root{
  --bg:#eef0f3; --surface:#ffffff; --ink:#1b1f24; --muted:#59636f; --line:#d5dae1;
  --accent:#1c5fc0; --accent-ink:#ffffff; --danger:#b3261e; --danger-bg:#fdecea;
  --paper:#fffdf7; --paper-ink:#171717; --paper-line:#222; --map-bg:#f4f4ef; --fill:#fff7b8;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --surface:#181d24; --ink:#e7eaee; --muted:#9aa5b3; --line:#2a313b;
    --accent:#7db0ff; --accent-ink:#06182f; --danger:#ff958c; --danger-bg:#3b1e1c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#181d24; --ink:#e7eaee; --muted:#9aa5b3; --line:#2a313b;
  --accent:#7db0ff; --accent-ink:#06182f; --danger:#ff958c; --danger-bg:#3b1e1c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;display:flex;align-items:center;gap:8px}
.single #bAll,.single #bPrevT,.single #bNextT{display:none}
.top .ttl{flex:1;min-width:0;text-align:center;line-height:1.15}
.top .ttl b{font-size:1.15rem;display:block}
.top .ttl small{color:var(--muted);font-size:.78rem}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:44px;height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:600}
.ibtn:hover{background:var(--bg)}
.ibtn[disabled]{opacity:.35;cursor:default}
.ibtn .lbl{display:none;font-size:.85rem}
@media(min-width:640px){.ibtn .lbl{display:inline}}

/* ---------- home grid ---------- */
.home{max-width:1000px;margin:0 auto;padding:18px 14px}
.home h1{font-size:1.5rem;margin:6px 0 2px}
.home p.sub{margin:0 0 16px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.tile .th{height:84px;display:flex;align-items:center;justify-content:center;background:var(--map-bg);border-radius:10px}
.tile .th svg{max-width:100%;max-height:76px}
.tile b{font-size:1.15rem}
.tile span{color:var(--muted);font-size:.82rem}
.tile .dncb{color:var(--danger)}

/* ---------- pages ---------- */
.pages{max-width:1040px;margin:0 auto;padding:14px 12px;display:flex;flex-direction:column;gap:22px}
.pg{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 66px)}
.pglabel{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;margin:0 4px 8px}
.pglabel i{flex:1;height:1px;background:var(--line)}
.card{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;
  box-shadow:var(--shadow);overflow:hidden}
.card h2.cardttl{font:700 1.3rem/1.2 "Times New Roman",Georgia,serif;text-align:center;margin:0;padding:14px 12px 4px}
.fields{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:6px 14px 10px;
  font:700 1rem "Times New Roman",Georgia,serif}
.fields span.v{font-weight:400;border-bottom:1px dotted #444;padding:0 6px;min-width:80px}
.fields .grow{flex:1 1 220px}
.frame{display:flex;flex-direction:column;border-top:2px solid var(--paper-line);border-bottom:2px solid var(--paper-line)}
.panel{padding:12px 14px;background:#fff;border-top:1px solid #222}
.panel .bignum{font:800 2.6rem/1 Helvetica,Arial,sans-serif;margin:0 0 6px}
.panel h3{font:700 .72rem/1 Helvetica,Arial,sans-serif;letter-spacing:.05em;margin:12px 0 6px;padding-bottom:6px;border-bottom:1px solid #222}
.panel ul{list-style:none;margin:0;padding:0;columns:2 150px;column-gap:18px;font-size:.92rem}
.panel li{break-inside:avoid;padding:1px 0}
.panel li em{font-style:normal;color:#444;font-size:.82em;white-space:nowrap}
.mapwrap{position:relative;order:-1}
.map{position:relative;width:100%;height:clamp(340px,64svh,620px);background:var(--map-bg);overflow:hidden;
  touch-action:pan-y;user-select:none;-webkit-user-select:none}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapctl{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapctl button{width:42px;height:42px;border-radius:10px;border:1px solid #888;background:#fff;color:#111;
  font:700 1.25rem/1 system-ui,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mapctl button:active{background:#e8e8e8}
.mapctl button.on{background:#1a73e8;color:#fff}.gpsmsg{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:86%;background:rgba(0,0,0,.78);color:#fff;font:12px/1.3 Helvetica,Arial,sans-serif;padding:5px 10px;border-radius:10px;z-index:4;text-align:center;pointer-events:none}

.north{position:absolute;right:12px;top:10px;z-index:2;display:flex;flex-direction:column;align-items:center;
  font:700 .75rem Helvetica,Arial,sans-serif;color:#111;background:rgba(255,255,255,.8);border-radius:8px;padding:3px 7px}
.north svg{position:static;width:16px;height:22px}
.sbar{position:absolute;left:12px;bottom:10px;z-index:2;font:600 .72rem Helvetica,Arial,sans-serif;color:#111;
  background:rgba(255,255,255,.85);padding:3px 7px 4px;border-radius:6px}
.sbar i{display:block;height:6px;border:2px solid #111;border-top:none;margin-top:2px}
.osm{position:absolute;right:6px;bottom:4px;z-index:2;font:.62rem Helvetica,Arial,sans-serif;color:#333;
  background:rgba(255,255,255,.75);padding:1px 5px;border-radius:4px}
.draftnote{margin:0;padding:8px 14px;background:#fdecea;color:#7a1c14;font:600 .85rem system-ui,sans-serif;border-top:1px solid #e3b3ae}
.fine{margin:0;padding:10px 14px 12px;font:700 .8rem/1.3 "Times New Roman",Georgia,serif}
@media(min-width:760px){
  .frame{flex-direction:row}
  .panel{width:270px;flex:none;border-top:none;border-right:2px solid #222}
  .mapwrap{order:0;flex:1;min-width:0}
  .map{height:clamp(420px,66svh,640px)}
  .card h2.cardttl{font-size:1.6rem}
}

/* ---------- back ---------- */
.back{padding:16px 16px 20px}
.back h2{font:700 1.35rem/1.2 "Times New Roman",Georgia,serif;margin:0 0 8px;padding-bottom:8px;border-bottom:2px solid #222;text-align:center}
.back h3{font:700 .85rem Helvetica,Arial,sans-serif;letter-spacing:.05em;margin:16px 0 6px;display:flex;align-items:baseline;gap:8px}
.back h3 small{font-weight:400;color:#555;letter-spacing:0}
.dnc{list-style:none;margin:0;padding:0;border:1px solid #e0b4b0;border-radius:10px;background:#fdf1ef;overflow:hidden}
.dnc li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid #f0d2cf;font-size:.95rem}
.dnc li:last-child{border-bottom:none}
.dnc li span:last-child{color:#7a2a24;white-space:nowrap}
.none{color:#555;font-style:italic;margin:0;padding:4px 2px}
.search{display:block;width:100%;max-width:420px;padding:11px 14px;border:1px solid #9aa;border-radius:12px;font-size:1rem;background:#fff;color:#111;margin:4px 0 10px}
.addr{list-style:none;margin:0;padding:0;columns:3 210px;column-gap:20px;font-size:.93rem}
.addr li{break-inside:avoid;display:flex;gap:8px;align-items:baseline;padding:4px 2px;border-bottom:1px solid #ecece4}
.addr li.hit span:first-child{font-weight:700}
.badge{background:#b3261e;color:#fff;font:700 .62rem Helvetica,Arial,sans-serif;padding:2px 6px;border-radius:999px;letter-spacing:.04em}
.empty{display:none;color:#555;font-style:italic;padding:6px 2px}

/* ---------- floating page buttons ---------- */
.fab[hidden]{display:none}
.fab{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fab .pill{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:600;box-shadow:var(--shadow)}
.fab .row{display:flex;gap:8px}
.fab button{width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);
  font-size:1.5rem;box-shadow:0 3px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.fab button.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.fab button[disabled]{opacity:.35}

/* ---------- map overlay ---------- */
.ov{position:fixed;inset:0;z-index:50;background:var(--map-bg);display:flex;flex-direction:column}
.ov[hidden]{display:none}
.ovbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.ovbar b{flex:1;font-size:1.05rem}
.ov .map{flex:1;height:auto;touch-action:none;cursor:grab}
.ov .map:active{cursor:grabbing}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:3;
  background:rgba(0,0,0,.65);color:#fff;font-size:.8rem;padding:6px 12px;border-radius:999px;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.fab{display:none!important}
.panel .dh{margin-top:16px}
.panel .dh small{font-weight:700;color:#b00020}
.panel ul.dnc{columns:1;display:block;border:1px solid #d9a5a0;background:#fdf1ef;border-radius:6px;font-size:.88rem}
.panel .dnc li{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;border-bottom:1px solid #f0d2cf}
.panel .dnc li:last-child{border-bottom:none}
.panel .none{margin:0;font-size:.88rem;color:#555}
.single #bPrint{display:inline-flex}
@page{size:landscape;margin:.35in}
@media print{
  html,body{background:#fff!important;min-height:0;padding:0;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top,.fab,.mapctl,.pglabel,.ov,.gpsmsg,.north{display:none!important}
  .pages{max-width:none;padding:0;gap:0}
  .card{box-shadow:none;border:none;border-radius:0}
  .card h2.cardttl{font-size:1.5rem;padding-top:0}
  .frame{flex-direction:row!important}
  .panel{width:3.1in!important;flex:none;border-top:none;border-right:2px solid #222;padding:8px 10px}
  .panel .bignum{font-size:2.2rem}
  .panel ul{font-size:.8rem}
  .panel ul.dnc{font-size:.8rem}
  .mapwrap{order:-1;flex:1;display:flex}
  .map{flex:1;height:auto!important;min-height:5.55in}
  .fine{font-size:.7rem;padding:6px 4px 0}
  .pg{break-inside:avoid}
  .panel.many{width:3.9in!important}
  .panel.many ul:not(.dnc){columns:2;column-gap:10px;font-size:.74rem}
  .panel.huge{padding:5px 8px}
  .panel.huge .bignum{font-size:1.7rem;margin-bottom:2px}
  .panel.huge h3{margin:5px 0 3px;padding-bottom:3px}
  .panel.huge ul:not(.dnc){font-size:.6rem;line-height:1.15}
  .panel.huge li{padding:0}
  .panel.huge ul.dnc{font-size:.62rem}
  .panel.huge ul.dnc li{padding:3px 6px}
  .card h2.cardttl{padding-bottom:0}
}
</style>
</head>

<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('data').textContent);
var NS="http://www.w3.org/2000/svg";
var view=document.getElementById('view'), fab=document.getElementById('fab');
var st={t:-1,p:0};
var SINGLE=!!window.SINGLE_T; if(SINGLE) document.documentElement.className+=' single';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pagesOf(t){return t.split?3:2;}
function pageName(t,p){return p===0?'Front (map)':(p===1?'Back':'Back (continued)');}

/* ---------------- routing ---------------- */
function parseHash(){
  var h=location.hash.replace(/^#\/?/,'');
  if(!h) return {t:-1,p:0};
  var m=h.match(/^([A-Z]+-\d+)(?:\/(\d+))?$/i);
  if(!m) return {t:-1,p:0};
  var i=D.findIndex(function(t){return t.n.toLowerCase()===m[1].toLowerCase();});
  if(i<0) return {t:-1,p:0};
  var p=Math.max(0,Math.min(pagesOf(D[i])-1,(parseInt(m[2]||'1',10)||1)-1));
  return {t:i,p:p};
}
function setHash(t,p,replace){
  var h=t<0?'':'#'+D[t].n+(p>0?'/'+(p+1):'');
  if(replace) history.replaceState(null,'',h||location.pathname+location.search);
  else location.hash=h;
}
var first=true;
function route(){
  var r=parseHash();
  if(SINGLE){
    var di=D.findIndex(function(t){return t.n===window.SINGLE_T;});
    if(di>=0&&r.t!==di){ history.replaceState(null,'','#'+D[di].n); r={t:di,p:0}; }
  }
  if(first){
    first=false;
    if(r.t<0&&window.DEFAULT_T){
      var di=D.findIndex(function(t){return t.n===window.DEFAULT_T;});
      if(di>=0){history.replaceState(null,'','#'+D[di].n);r={t:di,p:0};}
    }
  }
  if(r.t<0){showHome();return;}
  if(r.t!==st.t){showTerritory(r.t,r.p,true);}
  else{scrollToPage(r.p,true);}
}
window.addEventListener('hashchange',route);

/* ---------------- home ---------------- */
function thumb(t){
  var xs=t.poly.map(function(q){return q[0];}),ys=t.poly.map(function(q){return q[1];});
  var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs),y0=Math.min.apply(0,ys),y1=Math.max.apply(0,ys);
  var pad=20,d='M'+t.poly.map(function(q){return q[0]+','+q[1];}).join('L')+'Z';
  return '<svg viewBox="'+(x0-pad)+' '+(y0-pad)+' '+(x1-x0+2*pad)+' '+(y1-y0+2*pad)+'" aria-hidden="true"><path d="'+d+'" fill="#fff7b8" stroke="#111" stroke-width="22" stroke-linejoin="round"/></svg>';
}
function showHome(){
  st.t=-1;st.p=0;

  document.getElementById('tTitle').textContent='Buchanan Lake Territory Cards';
  document.getElementById('tSub').textContent='Buchanan Lake, TX';
  setNav();

  D.forEach(function(t,i){
    var dn=t.dnc.length;
    h+='<button class="tile" data-i="'+i+'"><div class="th">'+thumb(t)+'</div><b>'+t.n+'</b><span>'+(t.addrs.length?t.addrs.length+(t.addrs.length===1?' address':' addresses'):'addresses pending')+' &middot; '+pagesOf(t)+' pages</span>'+
       '<span class="'+(dn?'dncb':'')+'">'+(dn?dn+' Do Not Call'+(dn>1?'s':''):'No Do Not Calls')+'</span></button>';
  });

  window.scrollTo(0,0);
}

/* ---------------- territory ---------------- */
function dncBox(t){
  var h='<h3 class="dh">DO NOT CALLS <small>('+t.dnc.length+')</small></h3>';

  return h+'<ul class="dnc">'+t.dnc.map(function(d){return '<li><span>'+esc(d[0])+'</span><span>'+esc(d[1]||'')+'</span></li>';}).join('')+'</ul>';
}
function frontHTML(t){
  var li=t.streets.map(function(s){

  }).join('');
  return '<section class="pg" data-p="0"><div class="pglabel">Front <i></i></div><div class="card">'+
    '<h2 class="cardttl">Territory Map Card</h2>'+
    '<div class="fields"><span>Locality</span><span class="v grow">'+esc(t.loc)+'</span><span>Terr. No.</span><span class="v">'+t.n+'</span></div>'+

    '<div class="mapwrap"><div class="map" data-map="1"></div></div></div>'+

    '</div></section>';
}
function addrItems(list){

}

    h+='<section class="pg" data-p="2"><div class="pglabel">Back (continued) <i></i></div><div class="card back"><h2>Territory '+t.n+' &mdash; Addresses (continued)</h2>'+
       '<ul class="addr" id="a2">'+addrItems(rest)+'</ul><p class="empty" id="e2">No matching addresses on this page.</p></div></section>';

function showTerritory(i,p,instant){
  var t=D[i];st.t=i;st.p=p;
  closeOverlay();

  view.innerHTML=h;
  document.getElementById('tTitle').textContent=t.n;
  document.getElementById('tSub').textContent=t.loc+' \u00b7 1 page';
  document.title=t.n+' \u2013 Buchanan Lake Territory Cards';
  fab.hidden=false;
  setNav();
  var mapEl=view.querySelector('[data-map]');
  makeMap(mapEl,t,{interactive:false,controls:true,expand:true,auto:true});
  var q=document.getElementById('q');
  if(q) q.addEventListener('input',function(){filterAddr(q.value);});
  observe();
  requestAnimationFrame(function(){scrollToPage(p,instant);updateFab();});
}
function filterAddr(v){
  v=v.trim().toLowerCase();
  [['a1','e1'],['a2','e2']].forEach(function(ids){
    var ul=document.getElementById(ids[0]); if(!ul) return;
    var any=false;
    ul.querySelectorAll('li').forEach(function(li){
      var hit=!v||li.dataset.s.indexOf(v)>=0;
      li.style.display=hit?'':'none'; li.classList.toggle('hit',!!v&&hit); if(hit) any=true;
    });
    document.getElementById(ids[1]).style.display=(v&&!any)?'block':'none';
  });
}
function setNav(){
  var pb=document.getElementById('bPrevT'),nb=document.getElementById('bNextT');
  if(st.t<0){pb.style.visibility='hidden';nb.style.visibility='hidden';return;}
  pb.style.visibility=nb.style.visibility='visible';
  pb.disabled=st.t===0; nb.disabled=st.t===D.length-1;
  document.getElementById('lPrevT').textContent=st.t>0?D[st.t-1].n:'';
  document.getElementById('lNextT').textContent=st.t<D.length-1?D[st.t+1].n:'';
}
function sections(){return Array.prototype.slice.call(view.querySelectorAll('.pg'));}
function scrollToPage(p,instant){
  var s=sections()[p]; if(!s) return;
  s.scrollIntoView({behavior:instant?'auto':'smooth',block:'start'});
}
var io=null, visMap={};
function observe(){
  if(io) io.disconnect(); visMap={};
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){visMap[e.target.dataset.p]=e.intersectionRatio;});
    var best=0,bv=-1;Object.keys(visMap).forEach(function(k){if(visMap[k]>bv){bv=visMap[k];best=+k;}});
    if(best!==st.p){st.p=best;updateFab();setHash(st.t,st.p,true);}
  },{threshold:[0,.15,.3,.5,.7,.9,1],rootMargin:'-64px 0px 0px 0px'});
  sections().forEach(function(s){io.observe(s);});
}
function updateFab(){
  if(st.t<0) return;
  var t=D[st.t],n=pagesOf(t);
  document.getElementById('pill').textContent=pageName(t,st.p)+' \u00b7 '+(st.p+1)+'/'+n;
  var up=document.getElementById('bUp'),dn=document.getElementById('bDown');
  up.disabled=SINGLE?(st.p===0):(st.t===0&&st.p===0);
  dn.disabled=SINGLE?(st.p===n-1):(st.t===D.length-1&&st.p===n-1);
  dn.setAttribute('aria-label',st.p<n-1?'Next page':(!SINGLE&&st.t<D.length-1?'Next territory, '+D[st.t+1].n:'Last page'));
  up.setAttribute('aria-label',st.p>0?'Previous page':(!SINGLE&&st.t>0?'Previous territory, '+D[st.t-1].n:'First page'));
}
function nextPage(){
  var n=pagesOf(D[st.t]);
  if(st.p<n-1){scrollToPage(st.p+1,false);}
  else if(!SINGLE&&st.t<D.length-1){setHash(st.t+1,0);}
}
function prevPage(){
  if(st.p>0){scrollToPage(st.p-1,false);}
  else if(!SINGLE&&st.t>0){setHash(st.t-1,pagesOf(D[st.t-1])-1);}
}
document.getElementById('bDown').addEventListener('click',nextPage);
document.getElementById('bUp').addEventListener('click',prevPage);
document.getElementById('bAll').addEventListener('click',function(){setHash(-1,0);});
document.getElementById('bPrevT').addEventListener('click',function(){if(st.t>0) setHash(st.t-1,0);});
document.getElementById('bNextT').addEventListener('click',function(){if(st.t<D.length-1) setHash(st.t+1,0);});
document.addEventListener('keydown',function(e){
  var tag=(e.target&&e.target.tagName)||'';
  if(/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if(!document.getElementById('ov').hidden){ if(e.key==='Escape') closeOverlay(); return; }
  if(st.t<0) return;
  if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();nextPage();}
  else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();prevPage();}
  else if(!SINGLE&&e.key==='ArrowRight'&&st.t<D.length-1){setHash(st.t+1,0);}
  else if(!SINGLE&&e.key==='ArrowLeft'&&st.t>0){setHash(st.t-1,0);}
});

/* ---------------- map ---------------- */
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

function mkGps(svg,host,GEO,btn,getS,center,BB){

  var NS='http://www.w3.org/2000/svg',g=document.createElementNS(NS,'g');
  g.style.display='none';g.setAttribute('pointer-events','none');
  var ac=document.createElementNS(NS,'circle');
  ac.setAttribute('fill','#1a73e8');ac.setAttribute('fill-opacity','.14');ac.setAttribute('stroke','#1a73e8');ac.setAttribute('stroke-opacity','.45');ac.setAttribute('stroke-width','1');ac.setAttribute('vector-effect','non-scaling-stroke');
  var dg=document.createElementNS(NS,'g'),dc=document.createElementNS(NS,'circle');
  dc.setAttribute('r','1');dc.setAttribute('fill','#1a73e8');dc.setAttribute('stroke','#fff');dc.setAttribute('stroke-width','.3');
  dg.appendChild(dc);g.appendChild(ac);g.appendChild(dg);svg.appendChild(g);
  var msg=document.createElement('div');msg.className='gpsmsg';msg.style.display='none';host.appendChild(msg);
  var pos=null,wid=null,first=true,tm=null;
  function say(t){msg.textContent=t;msg.style.display='block';clearTimeout(tm);tm=setTimeout(function(){msg.style.display='none';},6000);}
  function upd(){
    if(!pos){g.style.display='none';return;}
    var s=getS();g.style.display='';
    ac.setAttribute('cx',pos.x);ac.setAttribute('cy',pos.y);ac.setAttribute('r',Math.max(pos.a,1));
    dg.setAttribute('transform','translate('+pos.x+' '+pos.y+') scale('+(8/s)+')');
  }
  function stop(){if(wid!==null){navigator.geolocation.clearWatch(wid);wid=null;}pos=null;first=true;btn.classList.remove('on');upd();}
  function ok(p){
    var k=111320*Math.cos(GEO[1]*Math.PI/180);
    pos={x:(p.coords.longitude-GEO[0])*k,y:-(p.coords.latitude-GEO[1])*110540,a:p.coords.accuracy||0};
    if(first){first=false;
      var m=250;
      if(pos.x>BB[0]-m&&pos.x<BB[2]+m&&pos.y>BB[1]-m&&pos.y<BB[3]+m) {center(pos.x,pos.y);msg.style.display='none';}

    }
    upd();
  }
  function bad(e){
    if(e&&e.code===1){stop();say('Location is blocked. Allow location for this page, or open the link in your browser.');}
    else say('Looking for your location…');
  }
  btn.addEventListener('click',function(ev){
    ev.preventDefault();
    if(wid!==null){stop();return;}
    first=true;btn.classList.add('on');say('Looking for your location…');
    try{wid=navigator.geolocation.watchPosition(ok,bad,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});}
    catch(x){stop();say('Location is not available here.');}
  });
  return upd;
}
function makeMap(host,t,opt){

  var inner=el('g',{fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},g);
  t.ways.forEach(function(w){
    if(w.h==='u'){el('path',{d:pathOf(w.p),stroke:'#8a8a8a','stroke-width':1.3,'stroke-dasharray':'5 4',fill:'none','vector-effect':'non-scaling-stroke'},casing);return;}
    var prim=w.h==='p',rw=t.rw||14;

      var gg=el('g',{'font-family':'Helvetica,Arial,sans-serif','font-size':f,'text-anchor':'middle',fill:'#14143a',stroke:'#ffffff','stroke-width':f*.24,'stroke-linejoin':'round','paint-order':'stroke'},g);gg.L=L;lvG.push(gg);

  if(t.rw){var lgd=document.createElement('div');lgd.className='osm';lgd.style.left='6px';lgd.style.right='auto';lgd.style.bottom='44px';lgd.innerHTML='<span style="display:inline-block;width:18px;border-top:2px dashed #8a8a8a;vertical-align:middle;margin-right:4px"></span>Road with no name on record';host.appendChild(lgd);}

var ov=document.getElementById('ov'),ovMap=document.getElementById('ovMap'),lastFocus=null;
