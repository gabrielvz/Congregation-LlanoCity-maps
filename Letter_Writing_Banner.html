<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Letter Writing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#1c4fa8 0%,#163f87 100%);font-family:Helvetica,Arial,sans-serif;color:#fff;display:flex;align-items:stretch;container-type:size}
.c{flex:1;margin:4cqmin;border:.5cqmin solid rgba(255,255,255,.35);border-radius:4cqmin;padding:4cqmin 5cqmin;position:relative;display:flex;flex-direction:column;min-height:0;height:calc(100cqh - 8cqmin)}

<div class="steps">
<div class="s"><span class="n">1</span><span>Tap the link below and enter your name</span></div>

</div></div>
<script>
