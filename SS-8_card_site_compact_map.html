  var wx=st.cx+(px-z.w/2)/s,wy=st.cy+(py-z.h/2)/s;st.k=nk;st.cx=wx-(px-z.w/2)/ns;st.cy=wy-(py-z.h/2)/ns;apply();}
apply();window.addEventListener('resize',apply);
/* two fingers move and zoom the map; one finger is left alone so the page behind can scroll */
var tp=null,td=function(a,b){return Math.sqrt((a.clientX-b.clientX)*(a.clientX-b.clientX)+(a.clientY-b.clientY)*(a.clientY-b.clientY));};
host.addEventListener('touchstart',function(e){if(e.touches.length===2){var a=e.touches[0],b=e.touches[1];tp={d:td(a,b),mx:(a.clientX+b.clientX)/2,my:(a.clientY+b.clientY)/2};}else tp=null;},{passive:true});
host.addEventListener('touchmove',function(e){if(e.touches.length!==2||!tp)return;if(e.cancelable)e.preventDefault();
  var a=e.touches[0],b=e.touches[1],d=td(a,b),mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2,r=host.getBoundingClientRect(),s=base()*st.k;
  st.cx-=(mx-tp.mx)/s;st.cy-=(my-tp.my)/s;if(tp.d>0)zoomAt(d/tp.d,mx-r.left,my-r.top);else apply();tp.d=d;tp.mx=mx;tp.my=my;},{passive:false});
host.addEventListener('touchend',function(e){if(e.touches.length<2)tp=null;},{passive:true});
/* mouse (computer) */
var md=null;host.addEventListener('mousedown',function(e){md={x:e.clientX,y:e.clientY};});
window.addEventListener('mouseup',function(){md=null;});
window.addEventListener('mousemove',function(e){if(!md)return;var s=base()*st.k;st.cx-=(e.clientX-md.x)/s;st.cy-=(e.clientY-md.y)/s;md={x:e.clientX,y:e.clientY};apply();});
host.addEventListener('wheel',function(e){e.preventDefault();var r=host.getBoundingClientRect();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top);},{passive:false});
host.addEventListener('dblclick',function(e){var r=host.getBoundingClientRect();zoomAt(1.8,e.clientX-r.left,e.clientY-r.top);});
if('ontouchstart' in window){var h=document.createElement('div');h.className='hint';h.textContent='Two fingers to zoom';host.appendChild(h);setTimeout(function(){h.style.display='none';},3500);}
})();
